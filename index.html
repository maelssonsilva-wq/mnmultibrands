<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Projeto 10 Apartamentos - 15x20m</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6f9;
      color: #333;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #2c3e50;
    }
    p.info {
      text-align: center;
      font-size: 14px;
      color: #7f8c8d;
      margin-bottom: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }
    canvas {
      border: 2px solid #3498db;
      border-radius: 8px;
      display: block;
      margin: 0 auto;
      background: #fdfdfd;
    }
    .legend {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      font-size: 14px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .color-box {
      width: 16px;
      height: 16px;
      border-radius: 4px;
    }
    footer {
      text-align: center;
      margin-top: 30px;
      color: #95a5a6;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Projeto Residencial: 10 Apartamentos (15m x 20m)</h1>
    <p class="info">
      Área total: 300m² | 10 apartamentos de 30m² | Circulação central | Paredes: 15cm
    </p>

    <canvas id="planta" width="900" height="600"></canvas>

    <div class="legend">
      <div class="legend-item"><div class="color-box" style="background:#e74c3c;"></div> <span>Parede Externa (15cm)</span></div>
      <div class="legend-item"><div class="color-box" style="background:#3498db;"></div> <span>Circulação Central</span></div>
      <div class="legend-item"><div class="color-box" style="background:#2ecc71;"></div> <span>Sala/Cozinha Integrada</span></div>
      <div class="legend-item"><div class="color-box" style="background:#f1c40f;"></div> <span>Quarto</span></div>
      <div class="legend-item"><div class="color-box" style="background:#9b59b6;"></div> <span>Banheiro</span></div>
      <div class="legend-item"><div class="color-box" style="background:#95a5a6;"></div> <span>Porta</span></div>
    </div>
  </div>

  <footer>Projeto gerado por IA | Escala aproximada 1:100</footer>

  <script>
    const canvas = document.getElementById('planta');
    const ctx = canvas.getContext('2d');

    // Configurações de escala
    const escala = 3; // 1m = 3px (ajustado para caber)
    const larguraTerreno = 15 * escala;  // 45px
    const comprimentoTerreno = 20 * escala; // 60px
    const parede = 0.15 * escala; // 15cm = 0.45px

    // Centralizar o desenho
    const offsetX = (canvas.width - comprimentoTerreno) / 2;
    const offsetY = (canvas.height - larguraTerreno) / 2;

    // Função para desenhar retângulo com preenchimento
    function fillRect(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(offsetX + x, offsetY + y, w, h);
    }

    // Função para desenhar parede (contorno)
    function drawWall(x, y, w, h) {
      ctx.strokeStyle = '#e74c3c';
      ctx.lineWidth = parede;
      ctx.strokeRect(offsetX + x, offsetY + y, w, h);
    }

    // Limpar canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // === DESENHO DO TERRENO EXTERNO ===
    drawWall(0, 0, comprimentoTerreno, larguraTerreno);

    // === CIRCULAÇÃO CENTRAL (corredor em cruz) ===
    const corredorLargura = 1.8 * escala;
    const corredorInicioX = (comprimentoTerreno - corredorLargura) / 2;
    const corredorInicioY = (larguraTerreno - corredorLargura) / 2;

    // Corredor horizontal
    fillRect(corredorInicioX, 0, corredorLargura, larguraTerreno, '#3498db');
    // Corredor vertical
    fillRect(0, corredorInicioY, comprimentoTerreno, corredorLargura, '#3498db');

    // === POSIÇÃO DOS APARTAMENTOS (10 unidades) ===
    // Divisão em 4 quadrantes + centro ajustado
    const aptSize = 30 ** 0.5 * escala; // ≈5.477 * 3 = ~16.43px (raiz quadrada de 30m²)
    const aptRealLarg = 5.5 * escala; // ~16.5px
    const aptRealComp = 5.5 * escala;

    // Offsets para evitar sobreposição com corredor
    const margin = 0.3 * escala;
    const positions = [
      // Canto superior esquerdo
      {x: margin, y: margin},
      lanzarote{x: comprimentoTerreno - aptRealComp - margin, y: margin},
      // Canto superior direito
      {x: comprimentoTerreno - aptRealComp - margin, y: margin},
      // Canto inferior esquerdo
      {x: margin, y: larguraTerreno - aptRealLarg - margin},
      // Canto inferior direito
      {x: comprimentoTerreno - aptRealComp - margin, y: larguraTerreno - aptRealLarg - margin},

      // Meio-esquerda (acima e abaixo do corredor vertical)
      {x: margin, y: corredorInicioY - aptRealLarg - margin},
      {x: margin, y: corredorInicioY + corredorLargura + margin},

      // Meio-direita
      {x: comprimentoTerreno - aptRealComp - margin, y: corredorInicioY - aptRealLarg - margin},
      {x: comprimentoTerreno - aptRealComp - margin, y: corredorInicioY + corredorLargura + margin},

      // Centro-esquerda e centro-direita (laterais do corredor horizontal)
      {x: corredorInicioX - aptRealComp - margin, y: margin},
      {x: corredorInicioX + corredorLargura + margin, y: margin},
    ];

    // Cores dos cômodos
    const cores = {
      sala: '#2ecc71',
      quarto: '#f1c40f',
      banheiro: '#9b59b6',
      porta: '#95a5a6'
    };

    positions.slice(0, 10).forEach((pos, i) => {
      const aptX = pos.x;
      const aptY = pos.y;

      // === APARTAMENTO (contorno) ===
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1;
      ctx.strokeRect(offsetX + aptX, offsetY + aptY, aptRealComp, aptRealLarg);

      // === DIVISÕES INTERNAS ===
      // Sala/Cozinha integrada (3.5m x 4m ≈ 14m²)
      fillRect(aptX, aptY, 4 * escala, 3.5 * escala, cores.sala);

      // Quarto (3m x 3.5m ≈ 10.5m²)
      fillRect(aptX + 4 * escala, aptY, 1.5 * escala, 3.5 * escala, cores.quarto);

      // Banheiro (1.5m x 2m ≈ 3m²) — no canto
      fillRect(aptX, aptY + 3.5 * escala, 1.5 * escala, 2 * escala, cores.banheiro);

      // Porta de entrada (na circulação)
      ctx.fillStyle = cores.porta;
      ctx.fillRect(
        offsetX + aptX + 1.5 * escala,
        offsetY + aptY - 0.3 * escala,
        1 * escala, 0.6 * escala
      );

      // Número do apartamento
      ctx.fillStyle = '#000';
      ctx.font = 'bold 10px Arial';
      ctx.fillText(`AP ${i+1}`, offsetX + aptX + 2, offsetY + aptY + 12);
    });

    // === LEGENDA NO CANVAS (opcional) ===
    ctx.fillStyle = '#2c3e50';
    ctx.font = 'bold 14px Arial';
    ctx.fillText('Escala: 1m = 3px | Área útil por apt: ~30m²', offsetX + 5, offsetY - 10);
  </script>

</body>
</html>
