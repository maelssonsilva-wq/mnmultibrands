<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Projeto 10 Apartamentos - Baixar Imagem</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6f9;
      color: #333;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #2c3e50;
    }
    p.info {
      text-align: center;
      font-size: 14px;
      color: #7f8c8d;
      margin-bottom: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }
    canvas {
      border: 2px solid #3498db;
      border-radius: 8px;
      display: block;
      margin: 0 auto;
      background: #fdfdfd;
    }
    .btn-img {
      display: block;
      margin: 20px auto;
      padding: 12px 24px;
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn-img:hover {
      background: #1e8449;
    }
    .legend {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      font-size: 14px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .color-box {
      width: 16px;
      height: 16px;
      border-radius: 4px;
    }
    footer {
      text-align: center;
      margin-top: 30px;
      color: #95a5a6;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Projeto Residencial: 10 Apartamentos (15m x 20m)</h1>
    <p class="info">
      Área total: 300m² | 10 apartamentos de 30m² | Circulação central | Paredes: 15cm
    </p>

    <canvas id="planta" width="1000" height="700"></canvas>

    <button class="btn-img" onclick="baixarImagem()">Baixar como Imagem (PNG)</button>

    <div class="legend">
      <div class="legend-item"><div class="color-box" style="background:#e74c3c;"></div> <span>Parede Externa (15cm)</span></div>
      <div class="legend-item"><div class="color-box" style="background:#3498db;"></div> <span>Circulação Central</span></div>
      <div class="legend-item"><div class="color-box" style="background:#2ecc71;"></div> <span>Sala/Cozinha Integrada</span></div>
      <div class="legend-item"><div class="color-box" style="background:#f1c40f;"></div> <span>Quarto</span></div>
      <div class="legend-item"><div class="color-box" style="background:#9b59b6;"></div> <span>Banheiro</span></div>
      <div class="legend-item"><div class="color-box" style="background:#95a5a6;"></div> <span>Porta</span></div>
    </div>
  </div>

  <footer>Projeto gerado por IA | Clique no botão para baixar a imagem em alta resolução</footer>

  <script>
    const canvas = document.getElementById('planta');
    const ctx = canvas.getContext('2d');

    // === CONFIGURAÇÕES DE ALTA QUALIDADE ===
    const escala = 18; // 1m = 18px (ótima resolução)
    const larguraTerreno = 15 * escala;  // 270px
    const comprimentoTerreno = 20 * escala; // 360px
    const parede = 0.15 * escala; // 2.7px

    const offsetX = (canvas.width - comprimentoTerreno) / 2 + 50;
    const offsetY = (canvas.height - larguraTerreno) / 2 + 50;

    // Funções de desenho
    function fill(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(offsetX + x, offsetY + y, w, h);
    }

    function stroke(x, y, w, h, lineWidth = 1, color = '#000') {
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.strokeRect(offsetX + x, offsetY + y, w, h);
    }

    // Limpar
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // === TERRENO EXTERNO ===
    stroke(0, 0, comprimentoTerreno, larguraTerreno, parede, '#e74c3c');

    // === CIRCULAÇÃO CENTRAL (cruz) ===
    const corLarg = 1.8 * escala;
    const corX = (comprimentoTerreno - corLarg) / 2;
    const corY = (larguraTerreno - corLarg) / 2;

    fill(corX, 0, corLarg, larguraTerreno, '#3498db');
    fill(0, corY, comprimentoTerreno, corLarg, '#3498db');

    // === APARTAMENTOS (5.5m x 5.5m ≈ 30m²) ===
    const aptL = 5.5 * escala;
    const margin = 0.3 * escala;

    const positions = [
      {x: margin, y: margin},
      {x: comprimentoTerreno - aptL - margin, y: margin},
      {x: margin, y: larguraTerreno - aptL - margin},
      {x: comprimentoTerreno - aptL - margin, y: larguraTerreno - aptL - margin},
      {x: margin, y: corY - aptL - margin},
      {x: margin, y: corY + corLarg + margin},
      {x: comprimentoTerreno - aptL - margin, y: corY - aptL - margin},
      {x: comprimentoTerreno - aptL - margin, y: corY + corLarg + margin},
      {x: corX - aptL - margin, y: margin},
      {x: corX + corLarg + margin, y: margin},
    ];

    // === DESENHAR APARTAMENTOS ===
    positions.slice(0, 10).forEach((pos, i) => {
      const x = pos.x;
      const y = pos.y;

      // Contorno do AP
      stroke(x, y, aptL, aptL, 2, '#000');

      // Sala/Cozinha (4m x 3.5m)
      fill(x, y, 4 * escala, 3.5 * escala, '#2ecc71');

      // Quarto (1.5m x 3.5m)
      fill(x + 4 * escala, y, 1.5 * escala, 3.5 * escala, '#f1c40f');

      // Banheiro (1.5m x 2m)
      fill(x, y + 3.5 * escala, 1.5 * escala, 2 * escala, '#9b59b6');

      // Porta
      let portaX, portaY, portaW, portaH;
      if (i < 4) {
        portaY = (i < 2) ? y - 0.6 * escala : y + aptL;
        portaX = x + 1.5 * escala;
        portaW = 1 * escala; portaH = 0.6 * escala;
      } else if (i < 8) {
        portaX = (i < 6) ? x - 0.6 * escala : x + aptL;
        portaY = y + 1.5 * escala;
        portaW = 0.6 * escala; portaH = 1 * escala;
      } else {
        portaY = y - 0.6 * escala;
        portaX = x + 1.5 * escala;
        portaW = 1 * escala; portaH = 0.6 * escala;
      }
      fill(portaX, portaY, portaW, portaH, '#95a5a6');

      // Número do AP
      ctx.fillStyle = '#000';
      ctx.font = 'bold 18px Arial';
      ctx.fillText(`AP ${i+1}`, offsetX + x + 8, offsetY + y + 28);
    });

    // === ESCALA E TÍTULO NO CANVAS ===
    ctx.fillStyle = '#2c3e50';
    ctx.font = 'bold 20px Arial';
    ctx.fillText('PROJETO: 10 APARTAMENTOS RESIDENCIAIS', offsetX + 10, offsetY - 40);
    ctx.font = '16px Arial';
    ctx.fillText('Terreno: 15m x 20m | Cada AP: ~30m² | Escala: 1:100', offsetX + 10, offsetY - 15);

    // === FUNÇÃO PARA BAIXAR IMAGEM ===
    function baixarImagem() {
      const link = document.createElement('a');
      link.download = 'Projeto_10_Apartamentos_15x20m.png';
      link.href = canvas.toDataURL('image/png', 1.0); // Máxima qualidade
      link.click();
    }
  </script>

</body>
</html>
