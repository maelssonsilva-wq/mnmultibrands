<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Projeto 10 Apartamentos - 15x20m</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6f9;
      color: #333;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
      color: #2c3e50;
    }
    p.info {
      text-align: center;
-font-size: 14px;
      color: #7f8c8d;
      margin-bottom: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    }
    canvas {
      border: 2px solid #3498db;
      border-radius: 8px;
      display: block;
      margin: 0 auto;
      background: #fdfdfd;
    }
    .legend {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      font-size: 14px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .color-box {
      width: 16px;
      height: 16px;
      border-radius: 4px;
    }
    footer {
      text-align: center;
      margin-top: 30px;
      color: #95a5a6;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Projeto Residencial: 10 Apartamentos (15m x 20m)</h1>
    <p class="info">
      Área total: 300m² | 10 apartamentos de 30m² | Circulação central | Paredes: 15cm
    </p>

    <canvas id="planta" width="900" height="600"></canvas>

    <div class="legend">
      <div class="legend-item"><div class="color-box" style="background:#e74c3c;"></div> <span>Parede Externa (15cm)</span></div>
      <div class="legend-item"><div class="color-box" style="background:#3498db;"></div> <span>Circulação Central</span></div>
      <div class="legend-item"><div class="color-box" style="background:#2ecc71;"></div> <span>Sala/Cozinha Integrada</span></div>
      <div class="legend-item"><div class="color-box" style="background:#f1c40f;"></div> <span>Quarto</span></div>
      <div class="legend-item"><div class="color-box" style="background:#9b59b6;"></div> <span>Banheiro</span></div>
      <div class="legend-item"><div class="color-box" style="background:#95a5a6;"></div> <span>Porta</span></div>
    </div>
  </div>

  <footer>Projeto corrigido e funcional | Escala 1:100</footer>

  <script>
    const canvas = document.getElementById('planta');
    const ctx = canvas.getContext('2d');

    // === CONFIGURAÇÕES ===
    const escala = 15; // 1m = 15px (melhor visualização)
    const larguraTerreno = 15 * escala;  // 225px
    const comprimentoTerreno = 20 * escala; // 300px
    const paredeEspessura = 0.15 * escala; // 2.25px

    const offsetX = (canvas.width - comprimentoTerreno) / 2;
    const offsetY = (canvas.height - larguraTerreno) / 2;

    // Funções de desenho
    function fill(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.fillRect(offsetX + x, offsetY + y, w, h);
    }

    function stroke(x, y, w, h, lineWidth = 1, color = '#000') {
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.strokeRect(offsetX + x, offsetY + y, w, h);
    }

    // Limpar
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // === TERRENO EXTERNO ===
    stroke(0, 0, comprimentoTerreno, larguraTerreno, paredeEspessura, '#e74c3c');

    // === CIRCULAÇÃO CENTRAL (cruz) ===
    const corLarg = 1.8 * escala;
    const corX = (comprimentoTerreno - corLarg) / 2;
    const corY = (larguraTerreno - corLarg) / 2;

    fill(corX, 0, corLarg, larguraTerreno, '#3498db'); // vertical
    fill(0, corY, comprimentoTerreno, corLarg, '#3498db'); // horizontal

    // === APARTAMENTOS (5.5m x 5.5m ≈ 30m²) ===
    const aptL = 5.5 * escala;
 cosy   const margin = 0.3 * escala;

    // Posições dos 10 apartamentos (evitando cruz central)
    const positions = [
      {x: margin, y: margin}, // 1
      {x: comprimentoTerreno - aptL - margin, y: margin}, // 2
      {x: margin, y: larguraTerreno - aptL - margin}, // 3
      {x: comprimentoTerreno - aptL - margin, y: larguraTerreno - aptL - margin}, // 4

      {x: margin, y: corY - aptL - margin}, // 5 (esq cima)
      {x: margin, y: corY + corLarg + margin}, // 6 (esq baixo)

      {x: comprimentoTerreno - aptL - margin, y: corY - aptL - margin}, // 7 (dir cima)
      {x: comprimentoTerreno - aptL - margin, y: corY + corLarg + margin}, // 8 (dir baixo)

      {x: corX - aptL - margin, y: margin}, // 9 (centro esq cima)
      {x: corX + corLarg + margin, y: margin}, // 10 (centro dir cima)
    ];

    // === DESENHAR CADA APARTAMENTO ===
    positions.slice(0, 10).forEach((pos, i) => {
      const x = pos.x;
      const y = pos.y;

      // Contorno do apartamento
      stroke(x, y, aptL, aptL, 1.5, '#000');

      // Sala/Cozinha (4m x 3.5m)
      fill(x, y, 4 * escala, 3.5 * escala, '#2ecc71');

      // Quarto (1.5m x 3.5m)
      fill(x + 4 * escala, y, 1.5 * escala, 3.5 * escala, '#f1c40f');

      // Banheiro (1.5m x 2m)
      fill(x, y + 3.5 * escala, 1.5 * escala, 2 * escala, '#9b59b6');

      // Porta (na face voltada para o corredor)
      let portaX, portaY;
      if (i < 4) {
        portaY = (i < 2) ? y - 0.6 * escala : y + aptL;
        portaX = x + 1.5 * escala;
        fill(portaX, portaY, 1 * escala, 0.6 * escala, '#95a5a6');
      } else if (i < 8) {
        portaX = (i < 6) ? x - 0.6 * escala : x + aptL;
        portaY = y + 1.5 * escala;
        fill(portaX, portaY, 0.6 * escala, 1 * escala, '#95a5a6');
      } else {
        portaY = y - 0.6 * escala;
        portaX = x + 1.5 * escala;
        fill(portaX, portaY, 1 * escala, 0.6 * escala, '#95a5a6');
      }

      // Número do AP
      ctx.fillStyle = '#000';
      ctx.font = 'bold 14px Arial';
      ctx.fillText(`AP ${i+1}`, offsetX + x + 5, offsetY + y + 20);
    });

    // Legenda no canvas
    ctx.fillStyle = '#2c3e50';
    ctx.font = 'bold 16px Arial';
    ctx.fillText('Escala: 1m = 15px | 10 apartamentos de ~30m²', offsetX + 10, offsetY - 10);
  </script>

</body>
</html>
